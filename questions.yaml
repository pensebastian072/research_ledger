    result_2026_07_30: >
      OVERTURNED by actually re-running them. All 51 batteries re-ran on 2026-07-30
      under the fixed gate: 0 pass at the 1.645 bar. Best are V2_backwardation_riskoff
      +1.533 and V1_ts_contango_timer +1.524 -- just short -- then H08_absorption_shift
