  - id: Q-COST-01
    question: >
      What does a side actually cost, versus the flat 5 bps every backtest on this box
      charges to every asset?
    repo: research_ledger
    registration: pre-registered
    answered_by: cost/costs.py (+ alpaca_gpu_lab/src/data/quotes_sample.py)
    evidence: alpaca_gpu_lab/journal/quote_spreads_2026-07-29.json
    yes_bar: >
      "answered" requires a per-symbol number from REAL quotes for at least 20 symbols,
      each labelled measured / predicted / fallback, with the IEX overstatement bias
      stated. A number without its source label does not count.
    status: "ANSWERED"
    result_2026_07_29: >
      The flat 5 bps is 5-25x too pessimistic. Measured from real IEX quotes over 12
      sampled sessions x 3 intraday windows (10.3M quotes, 21 symbols): SPY 0.23 bps,
      QQQ 0.34, IWM 0.39, TLT 0.57, EEM 0.87, XLF 0.95, FXI 1.30, GLD 2.56, VIXY 3.53,
      CPER 5.75. Median across 21 measured symbols 0.93 bps = 0.19x the assumption, and
      20 of 21 are CHEAPER than flat. Extended to 87 symbols via a log-log fit on
      dollar volume (R2 0.581, resid sd 0.548 log) -> median 0.76 bps = 0.15x flat,
      86 of 87 cheaper. IEX is one venue so these OVERSTATE true NBBO: the bias runs
      in the conservative direction.
    note: >
      The free route was tried first and rejected on evidence: cost/spread_ohlc.py
      proves Corwin-Schultz and Abdi-Ranaldo both return exactly 0.0 for any spread
      below ~40 bps at ETF volatility -- 1-2 orders of magnitude above what these ETFs
      quote. Quoted spread only; market impact is NOT included, so every cost here is
      a floor.

  - id: Q-QLIB-03
    question: >
      Does the qlib long-short survive once it is charged the REAL cost instead of a
      flat 5 bps per side?
    repo: qlib_lab
    registration: pre-registered
    answered_by: graders/qlib_recost.py
    evidence: qlib_lab/journal/exports/qlib_score_history.parquet + cost/costs.py
    yes_bar: >
      net mean PnL per rebalance > 0 with Newey-West t > 2 on at least 100 independent
      rebalance CLUSTERS (distinct dates, not rows), AND a corrected-DSR gate pass
      (ratio > 0, PBO < 0.5). Measured at the p90 stress cost as well as the median --
      an edge that only clears at median cost is recorded as NO.
    status: "NO"
    result_2026_07_29: >
      The cost assumption WAS the reason it looked like a loss -- and it is still not a
      win. Same score history, same trades, only the cost changed: at the flat 5 bps the
      5d long-short is -12.31 bps per rebalance (t -1.04); at the measured per-symbol
      cost it is +4.67 bps (t +0.39), and the cheaper constructions do better still --
      long_rest +7.78 (t 0.87), long_only +8.14 (t 1.02). Sign flipped from negative to
      positive purely by measuring the spread. But no variant reaches t > 2 and none
      clears the corrected DSR (best -0.285), so the verdict is NO: cost explained the
      loss, absence of signal explains the non-win. Both were true at once, and only
      measuring the cost separated them. 21d is NO-DATA at 84 clusters against the
      frozen 100 -- the bar stands.
    note: >
      Diagnostics on 2026-07-29 measured the gross top8-bottom8 spread at +9.0 bps per
      5-day rebalance while the pipeline charges 10-20 bps. Deciles are NON-monotonic
      (top +6.3 bps excess, bottom -2.1, decile 5 worst at -7.0), so top-vs-rest and
      top-vs-cash tilts are tested alongside, since they halve the leg count. Killed
      first: refit staleness (no IC decay) and a hidden vol bet (vol ratio 1.11).

  - id: Q-REL-04
    question: >
      Is the international-ETF overnight reversal a real, tradable effect once charged
      the real spread -- and is it self-reversal rather than a US lead?
    repo: research_ledger
    registration: pre-registered
    answered_by: graders/intl_reversal.py
    supersedes: Q-REL-01
    evidence: qlib_lab/csv/*.csv + cost/costs.py
    yes_bar: >
      net mean PnL > 0 with Newey-West t > 2 at the MEASURED per-symbol cost, on the
      basket, in at least 5 of the graded calendar years, AND a corrected-DSR gate pass
      with n_trials charged at the full family x threshold grid. If the whole edge sits
      in 2020, that is recorded as NO regardless of the pooled number.
    status: "REAL-BUT-NOT-SIGNIFICANT"
    weighting_review_2026_07_30: >
      MY HEADLINE WAS THE LEVERAGED CONVENTION. The +14.06 bps / +35.4%/yr / t 2.77 I
      reported is the PER-DEPLOYED-LEG series: it divides by the number of names firing
      that day, which means levering to full gross exposure on a day when only 1 of 9
      names fires. Mean names active is 1.14 of 9, so that is the normal case, not the
      edge case.
      Expressed as a portfolio you could actually run -- fixed 9 slots, 1/9 per name, no
      leverage -- the same signal gives +2.07 bps/day = +5.2%/yr, annualised Sharpe 0.604,
      t_NW +1.791. Below significance.
      Both conventions are legitimate and measure different things (edge per unit of
      deployed capital vs return on a fixed book). The frozen bar was applied to the
      leveraged one, which flattered it. Recorded here rather than retuned; Q-REL-05
      carries the deployable convention.
    beta_controls_2026_07_30: >
      PASSES the control that killed the qlib batteries, and this is the genuinely good
      news. Net exposure -0.0002 (20.5% of days net long, 24.3% net short, 55.3% flat),
      beta to SPY +0.0381, R2 0.0063 -- it is market-neutral, not a beta harvest.
      Alpha vs SPY +1.840 bps/day = +4.64%/yr, t +1.693.
      Alpha vs buying and holding the basket itself (+10.28%/yr) = +4.98%/yr, t +1.816.
      So the market explains essentially none of it -- but what is left is not
      statistically significant either.
      Both legs work symmetrically, which is what a real reversal should look like and
      what a directional artifact would not: fading a DOWN move +15.06 bps (t 2.004),
      fading an UP move +13.02 bps (t 1.958).
      Per name (per-deployed-leg) the sign is broad but individually weak: INDA +30.31
      (t 2.36), EWZ +32.98 (t 1.67), FXI +18.58 (t 1.47), EWY +18.30 (t 1.49), EWJ +15.79
      (t 2.03), EWU +15.88 (t 1.65), EEM +8.80 (t 0.84), VGK +8.58 (t 0.94), EWG +4.09
      (t 0.44). Only INDA and EWJ clear t>2 alone.
    honest_summary_2026_07_30: >
      Not beta, not a phase artifact, sign-consistent across nine names and both legs,
      9 of 10 years positive, on measured spreads. That is a real effect. It is also
      SMALL: ~5%/yr unlevered at Sharpe 0.60, with a t-stat of 1.79 that does not clear
      significance, and it needs daily closing-auction execution across up to nine
      international ETFs. The honest verdict is "probably real, too small and too weakly
      evidenced to size", not "the one that worked".
    result_2026_07_29: >
      The strongest result on this box, and it clears the frozen bar -- but NOT the
      stricter 1.645 threshold adopted the same day, so it stays SHADOW.
      Best pre-registered setting, basket / driver=self / |z|>=1.5:
      +14.06 bps/day = +35.4%/yr, Newey-West t 2.77, hit 55.7%, PF 1.288, PBO 0.000,
      corrected DSR +1.281, and 9 of 10 calendar years positive -- charged the measured
      per-symbol spread, not a flat guess. Unconditional (z>=0) also passes: +5.38
      bps/day, t 2.75, DSR +1.413, PBO 0.000, 8 of 11 years.
      THREE findings beyond the pass:
      (1) SELF-reversal beats the US lead decisively -- driver=self t 2.77 versus
      driver=SPY t 1.74 at the same threshold. Q-REL-01 was wrong in both directions:
      not an artifact, and not a "relationship" either. It is an ETF reverting its own
      prior move.
      (2) It is NOT a 2020 artifact: 9 of 10 years positive. The variant that IS a 2020
      artifact -- driver=SPY, z>=2.0, +64.5%/yr headline -- correctly reads NO, with its
      only graded year being 2020 at +115.8 bps.
      (3) Under the ratio>1.645 bar the user adopted, +1.281 and +1.413 both FAIL.
      So: a real, cost-surviving, mechanism-backed effect that the box's own new
      threshold rejects. Reported as-is rather than measured against the looser bar.
    note: >
      Supersedes Q-REL-01, which called this a stale-NAV artifact and stopped. It is
      not one ticker: the same sign runs across SPY->INDA -0.165, EEM -0.143, EWY
      -0.129, FXI -0.105, VGK -0.104, EWJ -0.095, and INDA's own lag-1 autocorrelation
      is -0.214 -- stronger than any cross-pair, which is why self-reversal must be
      separated from the US lead. Gross +9-10 bps/day; INDA's measured half-spread is
      1.02 bps, so the cost race is now decidable instead of assumed.

  - id: Q-GATE-01
    question: >
      Is the canonical deflated Sharpe implementation correct?
    repo: macro_gpu_lab
    registration: retroactive-from-code
    answered_by: audit/dsr_audit.py
    evidence: macro_gpu_lab/macro_gpu_lab/validate.py
    yes_bar: >
      on best-of-N pure noise the mean DSR probability must land within 0.10 of
      0.50, for N in {2, 8, 42}. That is the definition of deflation: remove the
      selection advantage, nothing more.
    status: "FIXED"
    result_2026_07_30: >
      PATCHED in all three copies on 2026-07-30 (macro_gpu_lab/validate.py,
      copper_brain/validate.py, hq-trading-system/analytics/research_scorecard.py),
      with the null-calibration test added to each so it cannot regress silently.
      A second defect surfaced while testing: `sigma <= 0` did not catch a CONSTANT
      series, whose std is float noise (~1.4e-17), so [0.1]*20 produced sr ~ 7e15 and
      prob 1.0 -- a constant PnL passing the gate. Non-finite input was unguarded too.
      Both fixed. hq's copy also had the n==1 branch omitting `denom`.
    result_2026_07_29: >
      BUG. The shipped formula returns mean prob 0.0000 for N=2, 8 and 42 -- it
      rejects everything by construction, and passes 0.000 of cases even when a
      true per-observation SR of 0.30 (~4.8 annualised) is planted. Cause: e_max is
      in units of sigma_SR but is subtracted from sr in raw per-observation SR
      units and the difference is then scaled by sqrt(T-1)/denom, inflating the
      penalty ~sqrt(T-1)-fold (14.5x at T=210, up to 111x observed). Corrected
      variants calibrate at 0.487-0.518. 163 stored rows recomputed; 15 flip to
      PASS. validate.py NOT patched -- see proposals/2026-07-29-dsr-unit-bug.md.

  - id: Q-GATE-03
    question: >
      Are the qlib hypothesis batteries reproducible run to run, or does their input
      history mutate underneath them?
    repo: qlib_lab
    registration: pre-registered
    answered_by: TODO graders/battery_reproducibility.py
    evidence: qlib_lab/journal/scorecards/experiments_2026-07-13.json vs _2026-07-30.json
    yes_bar: >
      re-running a battery on an unchanged historical window must reproduce its
      per-observation Sharpe to within 0.02 and its n exactly. Anything larger means
      the series is not fixed and no single-run verdict on it can be trusted.
    status: "NO"
    result_2026_07_30: >
      NOT reproducible, and this may be the most consequential finding of the whole
      exercise. Re-running the wave-1 batteries 17 days later, with n and n_trials
      IDENTICAL, moved the results materially:
        H07_vrp_spy          sr 0.3967 -> 0.2106, PF 5.02 -> 2.16, n 107 both times
        H08_absorption_shift sr 0.1199 -> 0.2946, PF 1.40 -> 2.11, n 104 both times
        H13_turn_of_month    sr 0.1124 -> 0.1146, PF 1.37 -> 1.38, n 120 -> 119
      H13 barely moved; H07 and H08 moved enormously in OPPOSITE directions. Since n is
      unchanged, this is not new trades being added -- the historical returns themselves
      changed. Leading suspect: qlib_lab/csv carries split/dividend-ADJUSTED closes with
      a `factor` column, and re-adjustment rewrites the whole history retroactively.
      Consequences, both bad: (1) any battery verdict is a snapshot of the price vintage
      it ran on, so "H07 replicates with PF 5.02" was never a stable fact; (2) the
      deep-history replication verdicts in Q-REL-02/03 inherit the same instability.
    diagnosis_2026_07_30: >
      CAUSE FOUND, and it is not data corruption -- the first guess (dividend
      re-adjustment rewriting history) is WRONG, because adding a dividend rescales all
      prior prices by a constant, which cancels in returns.
      The real cause is PHASE SENSITIVITY of the non-overlapping trade grid. Batteries
      sample trades at `iloc[253::horizon]`, and config.DAILY_YEARS = 10 is a ROLLING
      window, so every re-run starts the series on a later date and re-phases the whole
      grid onto different entry days. Measured directly on H07_vrp_spy by sweeping the
      grid offset 0..21:
        phase  0 -> sr +0.319  PF 2.235   phase 12 -> sr +0.220  PF 1.725
        phase  6 -> sr +0.478  PF 3.419   phase 18 -> sr +0.188  PF 1.646
        phase  9 -> sr +0.489  PF 3.257   phase 21 -> sr +0.319  PF 2.235 (= phase 0)
      A 2.6x swing in Sharpe and 2.1x in profit factor from nothing but the start offset,
      with phase 0 and 21 identical as the mechanism predicts. Both observed scorecard
      values (0.211 and 0.397) fall inside that range.
      So each battery verdict is one arbitrary 1/horizon slice of the data, and re-running
      silently redraws the slice. The fix is not to pin a price vintage: it is to stop
      throwing away 20/21 of the sample. Average the PnL over ALL phase offsets (or report
      the phase distribution), which uses every observation and makes the verdict
      deterministic. Anchoring the grid to a fixed calendar date would make it
      reproducible but still arbitrary.

  - id: Q-REL-05
    question: >
      Does the international-ETF reversal clear the gate as a DEPLOYABLE portfolio --
      fixed slots, no leverage, and alpha measured net of market beta?
    repo: research_ledger
    registration: pre-registered
    answered_by: graders/intl_reversal_portfolio.py
    supersedes: Q-REL-04
    evidence: qlib_lab/csv/*.csv + cost/costs.py
    yes_bar: >
      on a FIXED-SLOT, UNLEVERED basket: alpha against both SPY and the basket's own
      buy-and-hold must be > 0 with Newey-West t > 2, AND the corrected DSR must clear
      1.645 with PBO < 0.5. The weighting convention is named in the bar this time,
      because Q-REL-04 showed it moves the t-stat from 1.79 to 2.66.
    status: "NO"
    result_2026_08_07: >
      GRADED. NO -- fails three of the four frozen checks, and the grader reproduces the
      2026-07-30 beta controls independently (beta 0.038 vs 0.0381 recorded, R2 0.0062 vs
      0.0063), so this is a confirmation, not a new measurement.
      Fixed 9-slot unlevered book, driver=self, |z|>=1.5, measured per-symbol spreads,
      n=2512 days 2016-2026:
        book              +2.096 bps/day = +5.28%/yr, NW t 1.81
        alpha vs SPY      +4.68%/yr, t 1.600   (bar t > 2)  FAIL
        alpha vs basket   +5.03%/yr, t 1.719   (bar t > 2)  FAIL
        corrected DSR      0.5747              (bar > 1.645) FAIL
        PBO                0.0357              (bar < 0.5)   ok
        years positive     8/11                (bar >= 5)    ok
      Slots are filled on average 2.07 of 9 and the book is FULLY IDLE on 32.4% of days --
      that idle capital is the entire difference between Q-REL-04's +34.1%/yr per deployed
      leg and this +5.28%/yr, and it is why the deployable convention had to be graded
      separately.
    concentration_2026_08_07: >
      NEW AND IT MATTERS: Q-REL-04 recorded "not a 2020 artifact". That holds for the
      per-deployed-leg convention but is FALSE for the deployable book. 2020 supplies
      64.0% of all PnL from 10.1% of days; excluding 2020 the book returns +2.11%/yr
      instead of +5.28%/yr. Only ONE year (2021) reaches t > 2 on its own, and three years
      are negative (2016, 2022, 2025). Computed in the grader, not asserted.
    do_not_do_next: >
      The remaining pre-registered improvement -- concentrating on INDA and EWJ, the only
      two of nine names with individual t > 2 -- is selection on in-sample performance
      across nine candidates. Two independent measurements on this box the same day put
      that at a coin flip: ETF revert/trend classification persisted at rank correlation
      +0.003 (top-10 by training edge returned -102 bps out of sample, 2/10 positive), and
      D01 found selection on FX edge quality landed at the 53rd percentile. Being
      pre-registered makes it honest; it does not make it likely.
    note: >
      Q-REL-04 measured +34.1%/yr at t 2.66 per deployed leg and +5.2%/yr at t 1.79 as a
      fixed 9-slot book. Same signal, same trades -- only the capital convention differs.
      This question exists so the deployable number is the one on the record. Candidate
      improvements to test, all pre-registered here: concentrate on the names with
      individual t>2 (INDA, EWJ) versus the full family; scale position size by |z|
      rather than a hard 1.5 cut; and check whether the effect survives after 2020, since
      the per-year table is strongest 2019-2021.

  - id: Q-COST-02
    question: >
      How wrong would the measured spreads have to be to kill the international-ETF
      reversal -- and is it undercharged on the high-volatility days it actually trades?
    repo: research_ledger
    registration: pre-registered
    answered_by: cost sensitivity sweep, 2026-07-30
    evidence: alpaca_gpu_lab/journal/quote_spreads_2026-07-30.json
    yes_bar: >
      the concern is real if charging the within-session p90 spread (the stress proxy)
      drops the per-leg t below 2.
    status: "CONCERN-NOT-SUPPORTED"
    result_2026_07_30: >
      The worry does not survive measurement, which is the useful outcome. The reversal
      fires on |z| >= 1.5 -- high-vol days by construction -- so it should be systematically
      undercharged. But the within-session p90 half-spread is only 1.10x to 1.73x the
      median for these names, not the multiple the concern assumed:
        cost scenario            per-leg bps    t      book %/yr   book t
        median measured             13.53     2.66       5.22%      1.79
        within-session p90          12.72     2.51       4.93%      1.69
        3x median                   10.77     2.12       4.24%      1.46
        5x median                    8.00     1.58       3.25%      1.12
        10x median                   1.10     0.22       0.79%      0.27
        flat 5 bps (old assumption)  6.71     1.32       2.79%      0.96
      Break-even is roughly 8-10x the measured median, i.e. a 7-9 bps half-spread. The
      effect survives 3x cost error comfortably and only dies around 10x.
      REMAINING GAP, stated rather than papered over: the p90 is a WITHIN-SESSION
      percentile from 12 calm 2025-2026 sessions. It does not contain March 2020. Whether
      these ETFs quoted 10x wide in a real crisis is unmeasured, and the quote sample
      cannot answer it. That is the one cost question still open.
      Also visible in the table: the OLD flat 5 bps assumption sits at t 1.32 -- it was
      not merely conservative, it was strong enough to hide the effect entirely.

  - id: Q-GATE-05
    question: >
      Should multiple-comparison deflation be charged per family, or across every
      evaluation on the box, given that the DECISION is "which of everything do I trade"?
    repo: research_ledger
    registration: pre-registered
    answered_by: box-wide trial census, 2026-07-30
    evidence: alpaca ledger.jsonl + qlib/macro scorecards + research_ledger questions
    yes_bar: >
      a policy question, not an empirical one. It is "answered" when the box DECLARES a
      convention and applies it consistently, rather than defaulting silently.
    status: "OPEN-POLICY"
    result_2026_07_30: >
      Census of every registered evaluation: alpaca ledger 176, qlib batteries 36, qlib
      daily lgbm 4, macro models/strategies 14, research_ledger graded questions 16 --
      BOX-WIDE UNION N = 246.
      Cost of the choice: the deflation bracket is 1.9007 at a typical per-family n=20 and
      2.8325 at n=246, so box-wide accounting demands +0.932 MORE sigma_SR to clear the
      same bar. Applied to the current leaders:
        V2_backwardation  +1.533 -> +0.60      intl reversal  +1.281 -> +0.35
        V1_ts_contango    +1.524 -> +0.59      H08_absorption +0.921 -> -0.01
      Nothing is close under either convention, so this changes no verdict TODAY -- it
      changes what a future candidate must clear, which is when it will matter.
      My read: neither extreme is right. Per-family is too generous because the human
      picks across repos; box-wide is too harsh because the repos test genuinely distinct
      economic hypotheses rather than 246 variants of one. The defensible middle is to
      charge the union of trials that were candidates for the SAME decision. What is NOT
      defensible is the status quo, where the convention is implicit and therefore
      whichever one flatters the result.

  - id: Q-GATE-04
    question: >
      Do the "long asset when condition, else flat" batteries have any TIMING skill, or
      are they booking market beta as edge?
    repo: qlib_lab
    registration: pre-registered
    answered_by: TODO graders/battery_beta_control.py
    evidence: qlib_lab/qlib_lab/experiments.py::_signal_pnls
    yes_bar: >
      mean return on signal-ON days must exceed mean return on signal-OFF days, with a
      Welch t > 2. A strategy that merely holds a rising asset part-time has no skill
      no matter what its Sharpe or profit factor is.
    status: "NO"
    result_2026_07_30: >
      NO SKILL, and this is the finding that reframes every battery verdict on the box.
      `_signal_pnls` computes `pos * r - cost` and there is NO benchmark comparison
      anywhere in experiments.py (grep for benchmark/excess/vs_buy_hold: 0 hits). So a
      battery that is long SPY 50-86% of the time during 2016-2026 books beta and reports
      it as edge.
      Controls on the four highest-scoring batteries -- ON-day vs OFF-day mean SPY return,
      buy-and-hold = +15.52%/yr over the same window:
        H07_vrp_spy     exposure 50.2%  ON +15.74%  OFF +15.30%  Welch t +0.035
        W03_vol_managed exposure 50.6%  ON +13.49%  OFF +17.60%  Welch t -0.325
        V1_ts_contango  exposure 86.4%  ON +11.44%  OFF +41.44%  Welch t -0.908
        V2_backwardation exposure 86.4% ON +11.44%  OFF +41.44%  Welch t -0.908
      Every one is zero or NEGATIVE. V1 and V2 -- the two that came closest to clearing
      the raised gate at +1.533 and +1.524 -- are long precisely when SPY does WORSE.
      H07's phase-averaged overlapping portfolio returns +7.09%/yr with t_NW +2.485,
      which looks respectable until you notice that random 45% exposure harvests +7.79%.
      The t-statistic was measuring whether SPY's drift is positive, not whether the
      signal predicts anything.
      CAVEAT: these controls are quick reconstructions of the battery signals, not the
      exact battery code, and V2 in particular is simplified (it goes long TLT / short SPY
      in backwardation rather than flat). The direction is unambiguous but the exact
      numbers must be reproduced inside experiments.py before the batteries are rewritten.
    note: >
      Arguably a bigger defect than Q-GATE-03. Phase sensitivity made the numbers
      imprecise; this makes them measure the wrong thing. Both point the same way: a
      long-only-when-on design needs an explicit benchmark leg, and the gate should
      refuse to score a strategy that has no benchmark comparison at all.

  - id: Q-GATE-02
    question: >
      Is "DSR ratio > 0" a defensible promotion threshold?
    repo: research_ledger
    registration: pre-registered
    answered_by: audit/dsr_audit.py
    evidence: audit null-calibration output
    yes_bar: >
      a threshold is defensible if pure noise clears it less than 5% of the time.
    status: "RESOLVED"
    result_2026_07_30: >
      DEFLATED_SHARPE_MIN raised 0.0 -> 1.645 in macro_gpu_lab and copper_brain on
      2026-07-30 (qlib_lab and alpaca_gpu_lab inherit it through the imported gate).
      The consequence was accepted before it was measured and it duly landed: at
      1.645 NOTHING on this box passes -- not the surprise overlay (+0.238), not the
      two best qlib batteries (V2 +1.533, V1 +1.524), not the international-ETF
      reversal (+1.281). A gate that discriminates, with an empty pass list, is the
      honest end state.
    result_2026_07_29: >
      Fails its own bar by a wide margin. Once the DSR is computed correctly,
      ratio>0 is a MEDIAN test -- "better than the expected max of N noise trials" --
      and best-of-8 pure noise clears it 44.8% of the time. The defensible bar is
      ratio > 1.645 (prob > 0.95), under which exactly 1 of the 15 flipped rows
      survives (H07_vrp_spy). This is a threshold-policy decision for a human;
      nothing here changes it unilaterally.
