# The question registry. One entry per thing the box is trying to find out.
#
# `yes_bar` is FROZEN at registration (CLAUDE.md hard rule 2). A grader result never
# edits the bar it was tested against. If a bar turns out to be badly chosen, the
# honest move is to say so in `bar_review` and register a STRICTER SUCCESSOR question
# for future data -- never to retune the original and re-report it as a pass.
#
# provenance: on 2026-07-29 the graders were written (bars fixed in code) and run
# before this file existed, so the first eight entries are marked
# `registration: retroactive-from-code` -- the thresholds are transcribed verbatim
# from the module constants that were in place at first run, not chosen after seeing
# the numbers. Everything registered after this file exists is `pre-registered`.
# Saying which is which is the point; a registry that hides its own history is
# worthless.

meta:
  frozen_at: 2026-07-29
  gate: "PBO < 0.5 AND deflated Sharpe ratio > 1.645, on every horizon"
  gate_history:
    - "until 2026-07-30: ratio > 0, computed by a UNIT-INCONSISTENT formula that was a
       constant FAIL (prob 0.0000 on pure noise). No verdict from before that date
       carries information about the strategy it rejected."
    - "from 2026-07-30: the formula is fixed in all three copies and the bar is 1.645
       (prob > 0.95), because a correct ratio>0 is a median test that best-of-8 noise
       clears 44.8% of the time."
  gate_caveat: >
    Nothing on this box passes the gate as of 2026-07-30, and that is now a
    MEANINGFUL statement rather than an artifact of broken arithmetic. The closest
    are qlib V2_backwardation_riskoff (+1.533) and V1_ts_contango_timer (+1.524), then
    the international-ETF reversal (+1.281). Verdicts recorded before 2026-07-30 are
    kept with their original numbers and superseded in place, never edited.

questions:

  - id: Q-QLIB-01
    question: >
      Does the qlib Alpha158 daily cross-sectional lean predict forward returns?
    repo: qlib_lab
    registration: retroactive-from-code
    answered_by: graders/qlib_leans.py
    evidence: qlib_lab/journal/exports/qlib_score_history.parquet
    yes_bar: >
      rank IC > 0 with Newey-West t > 2 in at least 5 of the graded calendar years,
      per horizon, AND a positive net long-short spread after 0.0005/side cost.
    status: "NO"
    result_2026_07_29: >
      5d score IC +0.00808 (t_NW 1.07), 21d IC +0.00172 (t_NW 0.12). Years with
      IC>0 and t>2: 0 of 8 at 5d, 2 of 8 at 21d. Hit rate 51.6% against a 55.8%
      base rate -- the lean is WORSE than always-long. Net LS spread negative in
      7 of 8 years at 5d. The daily gate FAIL was correct, and now the reason is
      known: there is no cross-sectional signal to gate.

  - id: Q-QLIB-02
