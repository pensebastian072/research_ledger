  - id: Q-NEWS-02
    question: >
      When the news LLM and the macro brain disagree, which one does the tape prove
      right?
    repo: hq-trading-system
    registration: retroactive-from-code
    answered_by: graders/news_vs_model.py
    evidence: hq-trading-system/journal/macro/model_vs_news/*.jsonl
    yes_bar: >
      at least 30 divergences, then whichever side has the higher hit rate on the
      divergence subset wins.
    status: "NEWS-PROVISIONAL"
    bar_review: >
      THE BAR WAS SET TOO LOW and cleared on its first run -- recorded here rather
      than quietly fixed. 30 divergences sounds adequate but they come from only 29
      calendar days, and the 5d horizon overlaps so heavily that ~6 independent
      blocks exist, not 40. A hit-rate difference on 6 effective draws is not
      evidence. The result below is therefore reported as PROVISIONAL and
      Q-NEWS-03 carries the honest test. The original bar stays as written.
    result_2026_07_29: >
      33,036 logged rows -> 282 daily (date, asset) rows over 29 days. On the
      divergence subset news beats the model: 1d 58.1% vs 41.9% (n=43), 5d 65.0%
      vs 35.0% (n=40). Overall both are below the base rate (1d: model 41.2%,
      news 46.7%, base 47.0%). Also measured, and arguably the more useful finding:
      the comparison only fires on 53.9% of rows because the news side is sign 0 on
      40.1% and the macro side on 11.7% -- so the logged "agree/diverge" summary is
      structurally sparse, which is why 29 days produced so little.

  - id: Q-REL-01
    question: >
      Are the 25 lead-lag "survivors" a real cross-asset relationship or a
      stale-NAV microstructure artifact?
    repo: qlib_lab
    registration: retroactive-from-code
    answered_by: graders/leadlag_remine.py
    evidence: qlib_lab/journal/scorecards/experiments_2026-07-13.json (lead_lag block)
    yes_bar: >
      a pair must hold its sign and clear |corr| >= 0.05 across three disjoint
      splits, have a block-bootstrap holdout CI excluding zero, AND convert to
      holdout PnL that clears the gate with n_trials charged at the full scan size.
    status: "NO-SUPERSEDED"
    superseded_by: Q-REL-04
    supersede_note: >
      The verdict below stands as written and is NOT edited -- but Q-REL-04 shows it was
      wrong in BOTH directions. Testing the family instead of the survivor list, and
      charging the measured spread instead of a flat 5 bps, produces +14.06 bps/day at
      t 2.77 with PBO 0.000 and 9 of 10 years positive. The effect is real; it is also
      not the "SPY -> INDA relationship" the miner reported, but each ETF reverting its
      OWN prior move. The error here was stopping at "artifact" once a microstructure
      mechanism was identified, instead of asking whether the microstructure pays.
    result_2026_07_29: >
      Artifact, unambiguously. Thirds-validation alone cuts 25 survivors to 5, and
      ALL 5 target INDA (artifact share 1.00) -- a US-listed India ETF whose
      underlying market is shut during US hours, so any US leader "predicts" it at
      lag 1 through stale NAV. Excluding targets whose underlying market is closed
      during the US session leaves 0 survivors out of 20,832 tests. Nothing reached
      the bootstrap or the gate. Discovery-to-holdout shrink on the 5 was 0.30-0.53.

